name: Build reading site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install builder
        run: pip install -r requirements-build.txt
      - name: Rebuild docs and confirm it matches the commit
        run: |
          python scripts/build_site.py
          git diff --exit-code
